# DevSphere — production-style container stack (Option B in docs/SETUP.md).
#   docker compose -f compose.prod.yaml --env-file .env.production up -d --build
#   docker compose -f compose.prod.yaml --env-file .env.production run --rm backend python manage.py migrate
#
# Differences from compose.yaml: no source mounts, gunicorn + nginx, DEBUG off, Postgres not published to
# the host, and migrations are a deliberate one-off command. Put HTTPS (a managed load balancer, Caddy,
# Traefik, ...) in front of the `web` service. For real deployments prefer managed Postgres and S3 media.

name: devsphere-prod

services:
  db:
    image: postgres:18-alpine
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-devsphere}
      POSTGRES_USER: ${POSTGRES_USER:-devsphere}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]   # no `ports:` — the database is never exposed outside Docker

  backend:
    build:
      context: ./backend
      target: prod
    restart: always
    env_file:
      - ./backend/.env.production
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-devsphere}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-devsphere}
      DJANGO_ENV: production
      DJANGO_DEBUG: "False"
      MEDIA_ROOT: /app/media
    volumes:
      - media:/app/media   # only used when MEDIA_STORAGE=local; with S3 nothing is written here
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512m
    networks: [internal]

  web:
    build:
      context: ./frontend
      target: prod
      args:
        VITE_API_URL: /api
    restart: always
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - media:/srv/media:ro   # nginx serves uploads directly (MEDIA_STORAGE=local)
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128m
    networks: [internal]

volumes:
  pgdata:
  media:

networks:
  internal:
