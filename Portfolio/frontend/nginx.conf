# Production web server for the built SPA. Proxies the API and Django admin to the backend container
# so everything shares one origin (no CORS, simple cookies). Terminate HTTPS in front of this.
# Note: nginx drops server-level add_header lines inside any location that sets its own, so the
# security headers are repeated per location.

# Keep the original scheme when a load balancer in front already set it; otherwise use ours.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# Link-preview crawlers don't run JavaScript, so they get server-rendered title/description/image tags
# for case studies (/work/<slug>) from Django. Everyone else (including search engines) gets the app.
map $http_user_agent $is_preview_bot {
    default 0;
    "~*(facebookexternalhit|facebot|twitterbot|linkedinbot|slackbot|slack-imgproxy|discordbot|telegrambot|whatsapp|skypeuripreview|pinterest|redditbot|embedly|iframely|applebot)" 1;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 10m;  # slightly above MEDIA_MAX_UPLOAD_MB
    server_tokens off;

    # Project video uploads when MEDIA_STORAGE=local (with S3 the browser uploads straight to the bucket).
    # nginx buffers the whole body to disk first, so slow uploads never hold a gunicorn worker.
    # Keep client_max_body_size a little above VIDEO_MAX_UPLOAD_MB.
    location ~ ^/api/admin/projects/[0-9a-f-]+/videos/[0-9a-f-]+/file/$ {
        client_max_body_size 320m;
        client_body_timeout 300s;
        proxy_request_buffering on;
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 120s;
    }

    location ~ ^/(api|django-admin|static)/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;  # keeps the port, so Django builds correct absolute URLs
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 60s;
    }

    # Uploaded images (MEDIA_STORAGE=local): read straight from the shared, read-only media volume.
    # Storage keys are random and never reused, so they can be cached for a long time.
    location /media/ {
        alias /srv/media/;
        try_files $uri =404;
        # Range requests (video seeking) are served natively by nginx for static files.
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Hashed build assets never change: cache them for a year.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ~ ^/work/([a-z0-9-]+)/?$ {
        error_page 418 = @preview_bot;
        if ($is_preview_bot) { return 418; }
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header X-Frame-Options "DENY" always;
    }

    location @preview_bot {
        rewrite ^/work/([a-z0-9-]+)/?$ /api/public/share/work/$1/ break;
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # Client-side routes (/about, /admin/...) fall back to index.html, which must not be cached.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header X-Frame-Options "DENY" always;
    }
}
